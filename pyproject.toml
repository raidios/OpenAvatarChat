[project]
name = "open-avatar-chat-rpi"
version = "0.2.0"
description = "A lightweight voice + vision conversation system for Raspberry Pi, powered by cloud AI APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp~=3.11.12",
    "dashscope>=1.25.6",
    "dynaconf~=3.2.7",
    "fastapi[standard]~=0.115.12",
    "librosa~=0.10.2",
    "loguru~=0.7.3",
    "numpy<=1.26.4",
    "onnxruntime==1.23.2",
    "openai>=1.72.0",
    "opencv-python~=4.11.0",
    "Pillow>=10.0.0",
    "pip>=25.0.1",
    "pyaml>=25.1.0",
    "pyaudio>=0.2.14",
    "pydantic~=2.10.6",
    "pyyaml~=6.0.2",
    "scipy~=1.15.1",
    "setuptools>=78.1.0",
    "sherpa-onnx>=1.10.0",
    "soundfile~=0.13.1",
    "starlette~=0.41.3",
    "tqdm~=4.67.1",
    "typing-extensions~=4.12.2",
    "uvicorn~=0.34.0",
    "websockets>=12.0",
    "python-dotenv>=1.1.0",
    "pyserial>=3.5",
    "PySide6>=6.6.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.workspace]
members = [
    "src/handlers/vad/silerovad",
    "src/handlers/tts/bailian_tts",
    "src/handlers/tts/qwen_tts",
    "src/handlers/asr/qwen_asr",
    "src/handlers/wakeword/sherpa_kws",
]
